name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser for click-through smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the real academy buttons in Chromium
        run: node scripts/academy-browser-smoke.mjs
      - name: Keep deployable app
        uses: actions/upload-artifact@v4
        with:
          name: guitar-ai-coach-dist
          path: dist
          if-no-files-found: error
