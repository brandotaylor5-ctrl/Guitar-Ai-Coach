# Publishes the app to GitHub Pages so it can be used on a phone or another
# machine. Microphone access needs HTTPS, which Pages provides; opening the
# built files from disk would not work.
#
# The conversation panel falls back to its on-device keyword router here,
# because the model-backed one needs the local server that holds the API key.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Turns Pages on if it is not already, so nobody has to go and find the
      # setting before the app can be opened.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # Deployment succeeding only means an artifact was uploaded. Verify the
      # public Pages domain actually serves the matching lesson build.
      - name: Verify public website content after deploy
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          expected = {
            'web/index.html': 'data-release="2026-11-09-rhythm-academy"',
            'web/views/fretboardAcademy.js': 'Which fret makes',
            'web/views/practiceToday.js': 'Play what you know',
            'web/views/rhythmChapter.js': 'GUITAR ACADEMY',
            'web/rhythmChapter.css': 'rhythm-lesson-map',
            'web/audio/studyTone.js': 'playStudyTones',
            'repair.html': '2026-11-09-rhythm-academy',
          }
          problems = []
          for attempt in range(1, 16):
            problems = []
            for path, marker in expected.items():
              url = base + path + '?verified=' + str(time.time_ns())
              try:
                req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                with urllib.request.urlopen(req, timeout=12) as response:
                  body = response.read().decode('utf-8')
                  if response.status != 200 or marker not in body:
                    problems.append(path + ': public response lacks current marker')
              except Exception as exc:
                problems.append(path + ': ' + str(exc))
            if not problems:
              print('Verified on public Pages domain:', base)
              for path in expected:
                print('  OK', path)
              break
            print('Public release verification attempt', attempt, 'failed:', problems)
            if attempt < 15:
              time.sleep(4)
          if problems:
            raise SystemExit('Published app cannot be verified: ' + '; '.join(problems))
          PY
