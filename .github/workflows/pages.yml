# Publishes the app to GitHub Pages so it can be used on a phone or another
# machine. Microphone access needs HTTPS, which Pages provides; opening the
# built files from disk would not work.
#
# The conversation panel falls back to its on-device keyword router here,
# because the model-backed one needs the local server that holds the API key.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Turns Pages on if it is not already, so nobody has to go and find the
      # setting before the app can be opened.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
